{% extends "base.html" %}
{% block title %}Log in - StockIQ India{% endblock %}
{% block content %}
<section class="section">
  <div class="container">
    <div class="card form">
      <h1>Log in</h1>
      <p class="muted small">Log in to save stocks to your watchlist.</p>

      <div id="authMessage"></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="username">Username or email</label>
          <input type="text" id="username" name="username" required autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required
                 autocomplete="current-password">
        </div>
        <button class="btn btn-primary" type="submit" style="width:100%" id="loginSubmit">
          Log in
        </button>
      </form>

      <p class="small muted center" style="margin-top:16px">
        No account yet? <a href="/register">Create one</a>
      </p>
    </div>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
